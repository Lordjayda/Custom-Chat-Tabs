pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        gradlePluginPortal()
        mavenCentral()
    }

    resolutionStrategy {
        eachPlugin {
            if (
                    requested.id.id == "net.fabricmc.fabric-loom" ||
                    requested.id.id == "net.fabricmc.fabric-loom-remap" ||
                    requested.id.id == "fabric-loom"
            ) {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
}

rootProject.name = "Custom-Chat-Tabs"

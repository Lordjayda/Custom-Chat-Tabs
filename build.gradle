plugins {
    id 'fabric-loom' version '1.15.5'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    // Cloth Config is published on the Architectury Maven
    maven { url 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.1:v2"

    modImplementation "net.fabricmc:fabric-loader:0.19.2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"

    modImplementation "com.terraformersmc:modmenu:17.0.0"

    // Required for the Mod Menu config screen (Cloth Config API)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:21.11.153"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
loom {
    mixin {
        defaultRefmapName = "multichatwindows.refmap.json"
    }
}
version = project.mod_version

base {
    archivesName = project.archives_base_name
}
